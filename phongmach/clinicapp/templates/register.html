{% extends 'layout/base.html' %}
{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-6 col-lg-5">
        <div class="card border-0 shadow rounded-4 p-4 p-md-5">
            <h3 class="text-center fw-bold text-primary mb-4">Đăng Ký Tài Khoản</h3>

            {% if err_msg %}
            <div class="alert alert-danger">{{ err_msg }}</div>
            {% endif %}

            <form method="POST" action="/register">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Họ và tên *</label>
                    <input type="text" name="name" class="form-control" placeholder="Nhập họ và tên" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Tên đăng nhập *</label>
                    <input type="text" name="username" class="form-control" placeholder="Nhập tên đăng nhập" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Mật khẩu *</label>
                    <input type="password" name="password" class="form-control" placeholder="Nhập mật khẩu" required>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">Xác nhận mật khẩu *</label>
                    <input type="password" name="confirm" class="form-control" placeholder="Nhập lại mật khẩu" required>
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold">Đăng ký</button>
            </form>

            <p class="text-center text-muted mt-3 mb-0">
                Đã có tài khoản? <a href="/login" class="fw-semibold">Đăng nhập ngay</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
