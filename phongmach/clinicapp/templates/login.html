{% extends 'layout/base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 card p-4 shadow-sm">
        <h3 class="text-center text-primary mb-3">ĐĂNG NHẬP HỆ THỐNG</h3>
        {% if err_msg %}<div class="alert alert-danger">{{ err_msg }}</div>{% endif %}
        <form method="POST">
            <div class="mb-3"><label>Tên đăng nhập</label><input type="text" name="username" class="form-control" required></div>
            <div class="mb-3"><label>Mật khẩu</label><input type="password" name="password" class="form-control" required></div>
            <button type="submit" class="btn btn-primary w-100">Đăng nhập</button>
        </form>
        <small class="text-muted mt-3">Tài khoản mẫu (pass: 123456): <b>admin</b>, <b>yta</b>, <b>bacsi</b>, <b>thungan</b></small>
    </div>
</div>
{% endblock %}
